api:
  base_url: "https://external-api.kalshi.com/trade-api/v2"
  paths:
    markets: "/markets"
    market: "/markets/{ticker}"
    orderbook: "/markets/{ticker}/orderbook"
    trades: "/markets/trades"
    historical_cutoff: "/historical/cutoff"
    historical_markets: "/historical/markets"
    candlesticks: "/series/{series_ticker}/markets/{ticker}/candlesticks"
    historical_candlesticks: "/historical/markets/{ticker}/candlesticks"
  timeout_sec: 15
  max_requests_per_sec: 5
  orderbook_depth: 0
  max_retries: 5
  trades_page_limit: 1000

series:
  - KXHIGHNY

cadence_sec:
  markets: 300
  orderbook: 5
  trades: 60
  settlement: 86400

storage:
  raw_dir: "data/raw"
  heartbeat_db: "data/heartbeat.sqlite"
  backfill_db: "data/backfill.sqlite"
  labels_csv: "data/labels/clinyc.csv"

history:
  # TODO(verify): Kalshi renamed series with a KX prefix ~2024; HIGHNY is the
  # suspected legacy NYC-high series. Live /markets?series_ticker=HIGHNY returned [].
  series:
    - KXHIGHNY
    - HIGHNY
  statuses:
    - settled
    - closed
  candle_period_minutes: 1
  candle_chunk_minutes: 1440

cli_labels:
  start_date: "2020-01-01"
  iem_retrieve_url: "https://mesonet.agron.iastate.edu/cgi-bin/afos/retrieve.py"

climate:
  cli_time_convention: unknown  # lst | ldt | unknown

asos_obs:
  start_date: "2021-01-01"
  # TODO(verify): IEM station ids in NY_ASOS (NYC=Central Park; LGA=LaGuardia).
  stations: ["NYC", "LGA"]
  network: "NY_ASOS"
  iem_asos_url: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
  data_fields:
    - tmpf  # TODO(verify): air temperature Fahrenheit @ 2m

clockb_check:
  out_dir: "analysis/out"

station_basis:
  out_dir: "analysis/out"
  start_date: "2021-01-01"
  knyc_station: "NYC"
  klga_station: "LGA"

turnover_census:
  out_dir: "analysis/out"
  primary_band: [0.10, 0.90]

window_mismatch:
  out_dir: "analysis/out"

bracket_enumeration:
  out_dir: "analysis/out"
  start_date: "2021-08-05"

forecast_vs_market:
  out_dir: "analysis/out"
  horizon_h: 24
  primary_band: [0.10, 0.90]

nbm_latency_check:
  out_dir: "analysis/out"
  assumed_latency_min: 441
  min_cycles: 20

nbm_availability_watch:
  out_dir: "analysis/out"
  poll_interval_sec: 300
  min_cycles: 6
  max_watch_age_hours: 12
  assumed_latency_min: 441
  sources: ["aws", "nomads"]

nbm_archive:
  base_url: "https://noaa-nbm-grib2-pds.s3.amazonaws.com"
  publication_latency_min: 441
  publication_latency_max_min: 453
  station_lat: 40.779
  station_lon: -73.969
  start_date: "2022-12-11"
  end_date: "2026-05-03"
  snapshot_horizon_h: 24
  decoded_dir: "data/nbm/decoded_v441"
  backfill_db: "data/backfill_v441.sqlite"
  # K2 calibration scope: 9 deciles of the 18-h max-window ladder, not all 99 levels.
  percentile_levels: [10, 20, 30, 40, 50, 60, 70, 80, 90]
  sample_size: 300
  sample_seed: 43
  # v4.2 boundary splits early (v4.0/v4.1) vs late (v4.2/v4.3) within the market span.
  sub_era_split: "2024-05-15"

depth_census:
  horizons_h: [24, 12, 6, 3, 1]
  out_dir: "analysis/out"
  primary_band: [0.10, 0.90]

validate_emission_forward:
  out_dir: "analysis/out"

polymarket:
  gamma:
    base_url: "https://gamma-api.polymarket.com"
    timeout_sec: 15
    max_requests_per_sec: 10
    max_retries: 3
    series_slug: "nyc-daily-weather"
    event_slug_prefix: "highest-temperature-in-nyc-on"
    discovery_limit: 10
    horizon_days: 2
  clob:
    base_url: "https://clob.polymarket.com"
    book_path: "/book"
    timeout_sec: 15
    max_requests_per_sec: 15
    max_retries: 5
  markets:
    series_slug: "nyc-daily-weather"
    horizon_days: 2
  cadence_sec:
    markets: 300
    orderbook: 5
  storage:
    raw_dir: "data/raw"
    heartbeat_db: "data/polymarket_heartbeat.sqlite"

logging:
  level: INFO
