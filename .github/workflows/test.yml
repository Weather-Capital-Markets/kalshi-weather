name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-analysis.txt

      - name: Ruff
        run: ruff check .

      - name: Import linter (strategy boundary)
        run: lint-imports

      - name: Mypy (wxmm, strict)
        run: mypy --strict wxmm

      - name: Pytest
        run: pytest -q

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-analysis.txt

      - name: Mutation checks (must turn tests red)
        run: make mutants
