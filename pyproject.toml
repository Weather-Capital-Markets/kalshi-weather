[project]
name = "kalshi-weather"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wxmm"]
warn_unused_ignores = true
show_error_codes = true
# ingestion/ and analysis/ are pandas-era code and are not under mypy --strict.

[[tool.mypy.overrides]]
module = ["polars", "polars.*", "duckdb"]
ignore_missing_imports = true
