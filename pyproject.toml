[project]
name = "kalshi-weather"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wxmm"]
warn_unused_ignores = true
show_error_codes = true
# ingestion/ and analysis/ are pandas-era code and are not under mypy --strict.

[[tool.mypy.overrides]]
module = ["polars", "polars.*", "duckdb"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["wxmm", "strategies"]

[[tool.importlinter.contracts]]
name = "Strategy cannot reach store, venues, settlement, or backtest clock"
type = "forbidden"
source_modules = ["wxmm.strategy", "strategies"]
forbidden_modules = ["wxmm.data", "wxmm.venues", "wxmm.settlement", "wxmm.backtest"]

[[tool.importlinter.contracts]]
name = "Decide cannot reach execute, live, or backtest"
type = "forbidden"
source_modules = ["wxmm.decide"]
forbidden_modules = ["wxmm.execute", "wxmm.live", "wxmm.backtest"]

[[tool.importlinter.contracts]]
name = "Live cannot reach backtest"
type = "forbidden"
source_modules = ["wxmm.live"]
forbidden_modules = ["wxmm.backtest"]

[[tool.importlinter.contracts]]
name = "Backtest cannot reach live"
type = "forbidden"
source_modules = ["wxmm.backtest"]
forbidden_modules = ["wxmm.live"]

[[tool.importlinter.contracts]]
name = "Measure cannot reach live transports"
type = "forbidden"
source_modules = ["wxmm.measure"]
forbidden_modules = ["wxmm.live"]

[[tool.importlinter.contracts]]
name = "Fair value cannot reach execute"
type = "forbidden"
source_modules = ["wxmm.fairvalue", "wxmm.eval"]
forbidden_modules = ["wxmm.execute"]

[[tool.importlinter.contracts]]
name = "C1-X1 analysis cannot import book reconstruction"
type = "forbidden"
source_modules = ["wxmm.analysis"]
forbidden_modules = [
    "wxmm.core.book",
    "wxmm.core.book_quality",
    "wxmm.fairvalue",
]
